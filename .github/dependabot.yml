# Weekly updates for Rust dependencies, frontend packages and GitHub Actions,
# each in one grouped pull request.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Conventional commit messages: "build(deps): …"
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        patterns: ['*']
    # Major version jumps change the API and are a refactoring of their own,
    # so only compatible updates come automatically. Security updates are
    # reported by Dependabot regardless.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
