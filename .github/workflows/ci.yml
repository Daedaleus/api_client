# Checks the workspace on Windows, Linux and macOS with the same mise tasks
# developers run locally (mise.toml). Formatting and test coverage run once
# (Linux); clippy and tests on all three systems; the end-to-end smoke test
# drives the real release build on Windows. Release builds, virus scans,
# checksums and the GitHub release join once there is a program to ship (see
# CLAUDE.md, "Releases").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo fmt --all -- --check

  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            optional: false
          - name: Linux
            os: ubuntu-latest
            optional: false
          - name: macOS
            os: macos-latest
            # GitHub often assigns macOS runners late or not at all; a failure
            # there does not turn the run red (Windows and Linux do).
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    # Without cache Windows can take over 30 minutes once the app exists.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Toolchain from rust-toolchain.toml, including the cargo cache.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      # Tools (Node, cargo tools) in the versions from mise.toml.
      - uses: jdx/mise-action@v5
      - name: Linux packages for Tauri (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Lint
        run: mise run lint
      - name: Tests
        run: mise run test

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: jdx/mise-action@v5
      # Rust (without the desktop app) and frontend logic, at least 90 % each.
      - name: Measure coverage (at least 90 %)
        run: mise run coverage

  e2e:
    name: End-to-end (Windows)
    runs-on: windows-latest
    # Release build without cache takes a while on Windows.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: jdx/mise-action@v5
      # Release build, then the real window: send to a local server and to a
      # closed port, check what is shown and that the program keeps running.
      - name: Smoke test of the release build
        run: mise run e2e
