[package]
name = "ac_app"
description = "Application layer: use cases, commands, events, view models and ports."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test doubles (`ac_app::testing`) for other crates' tests.
testing = []
# Type descriptions for generating the TypeScript bindings (used by the
# desktop app); keeps ac_app free of UI dependencies otherwise.
specta = ["dep:specta"]

[dependencies]
ac_domain.workspace = true
ac_interchange.workspace = true
base64.workspace = true
getrandom.workspace = true
hmac.workspace = true
md-5.workspace = true
sha2.workspace = true
serde.workspace = true
specta = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
