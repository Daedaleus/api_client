[package]
name = "ac_cli"
description = "Command line runner: runs a collection's requests, e.g. in CI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "api-client-cli"
path = "src/main.rs"

[dependencies]
ac_app.workspace = true
ac_http.workspace = true
ac_scripting.workspace = true
ac_secrets.workspace = true
ac_storage.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
ac_domain.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
wiremock.workspace = true

[lints]
workspace = true
