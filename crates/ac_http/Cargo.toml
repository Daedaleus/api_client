[package]
name = "ac_http"
description = "HTTP adapter: implements the HttpSender port with reqwest."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ac_app.workspace = true
ac_domain.workspace = true
# multipart: form data with files; tokio fs: reading files to send.
reqwest = { workspace = true, features = ["multipart"] }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net"] }
url.workspace = true
wiremock.workspace = true

[lints]
workspace = true
