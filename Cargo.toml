# Virtual workspace. Architecture and dependency direction:
# docs/architecture.md. Spikes live in spikes/ and are not workspace members.
[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Daedaleus/api_client"
publish = false

[workspace.dependencies]
ac_app = { path = "crates/ac_app" }
ac_domain = { path = "crates/ac_domain" }
ac_http = { path = "crates/ac_http" }
ac_interchange = { path = "crates/ac_interchange" }
ac_scripting = { path = "crates/ac_scripting" }
ac_secrets = { path = "crates/ac_secrets" }
ac_storage = { path = "crates/ac_storage" }
# age: secrets for several recipients (ADR S4); armor for text files in git,
# ssh for SSH keys as recipients and identities.
age = { version = "0.12", features = ["armor", "ssh"] }
# base64: the credentials of HTTP Basic authentication.
base64 = "0.22"
# miniz_oxide: the TypeScript compiler embedded compressed in the desktop app (ADR S2).
miniz_oxide = "0.8"
# oxc: TypeScript to JavaScript for request scripts (ADR S1), one version for all parts.
oxc_allocator = "0.159"
oxc_codegen = "0.159"
oxc_parser = "0.159"
oxc_semantic = "0.159"
oxc_span = "0.159"
oxc_transformer = "0.159"
# rquickjs: the QuickJS engine (quickjs-ng) that runs request scripts (ADR S1).
rquickjs = "0.14"
# getrandom and sha2: the PKCE verifier and challenge of the OAuth 2 sign-in;
# sha2, hmac and md-5 also sign requests (AWS Signature v4, HTTP Digest).
getrandom = "0.3"
hmac = "0.12"
md-5 = "0.10"
# p12-keystore and pkcs8: client certificates as PKCS#12 files or with an
# encrypted PEM key (rustls reads only unencrypted PEM itself).
p12-keystore = "0.4"
pkcs8 = { version = "0.10", features = ["encryption", "pem", "3des", "std"] }
sha2 = "0.10"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
# clap: command line arguments of the CLI runner.
clap = { version = "4", features = ["derive"] }
# shell-words: splitting pasted cURL commands like a POSIX shell.
shell-words = "1"
serde_json = "1"
# Specta and tauri-specta are release candidates: pin exact versions, as their
# docs require, and upgrade them together.
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
thiserror = "2"
# yaml-rust2: reading OpenAPI descriptions written in YAML (pure Rust,
# maintained; serde_yaml is not any more).
yaml-rust2 = "0.13"
trash = "5"
toml_edit = "0.25"
tokio = "1"
url = "2"
uuid = { version = "1", features = ["v5", "v7"] }
wiremock = "0.6"
# rcgen and tokio-rustls: test certificates and a TLS server for the
# client certificate (mTLS) tests.
rcgen = "0.14"
tokio-rustls = "0.26"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
