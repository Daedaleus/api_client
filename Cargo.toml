# Virtual workspace. Architecture and dependency direction:
# docs/architecture.md. Spikes live in spikes/ and are not workspace members.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Daedaleus/api_client"
publish = false

[workspace.dependencies]
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
