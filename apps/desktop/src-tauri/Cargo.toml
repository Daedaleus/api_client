[package]
name = "ac_desktop"
description = "Desktop app (Tauri): wires the adapters into ac_app and forwards commands and events."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The app itself; `bindings` is a helper program (see below).
default-run = "ac_desktop"

# Checks or writes the TypeScript bindings. No test harness: test binaries
# linking Tauri cannot start on Windows (see src/lib.rs).
[[bin]]
name = "bindings"
path = "src/bin/bindings.rs"
test = false

[build-dependencies]
tauri-build.workspace = true

[dependencies]
ac_app = { workspace = true, features = ["specta"] }
ac_http.workspace = true
ac_storage.workspace = true
serde.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-specta.workspace = true
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true
