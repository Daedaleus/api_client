# Settings for cargo-deny (see .github/workflows/audit.yml).
# Every exception needs a reason.

[advisories]
ignore = [
    # proc-macro-error is a build-time macro helper pulled in by the GTK 3
    # bindings Tauri uses on Linux (gtk-rs via webkit2gtk). It runs only at
    # compile time and needs a Tauri/wry upgrade to go away.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, via Tauri's Linux GTK bindings; needs upstream upgrade" },
    # paste is a build-time macro helper used by specta (typed bindings). The
    # advisory is "unmaintained", not a vulnerability; it goes away when
    # specta replaces it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained, build-time only, via specta; no safe upgrade available" },
    # The next three come with age (secrets, ADR S4); no fixed age release yet.
    # rsa: only for ssh-rsa keys. The Marvin attack needs an attacker timing
    # many RSA decryptions over the network; here a user's own key decrypts a
    # local file once, nothing remote can trigger or time it.
    { id = "RUSTSEC-2023-0071", reason = "via age (ssh-rsa); local decryption only, no network timing oracle" },
    # crypto-bigint 0.5 via p256/hpke in age: only used for age's p256 "tag"
    # recipients, which this app neither parses nor creates (x25519 and SSH).
    { id = "RUSTSEC-2026-0387", reason = "via age p256 tag recipients, a code path this app never uses" },
    # basic-toml: unmaintained, read at compile time by age's i18n macros.
    { id = "RUSTSEC-2026-0374", reason = "unmaintained, build-time only, via age's i18n macros; no safe upgrade" },
]

[licenses]
# Licenses compatible with distributing the program under MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # File-level copyleft: using unmodified MPL crates (cssparser, selectors …
    # via Tauri) in a binary is fine; changes to those files would be MPL.
    "MPL-2.0",
    # Data license of the Mozilla root certificates (webpki-root-certs).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates refer to each other by path without a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
